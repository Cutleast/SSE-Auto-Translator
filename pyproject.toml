[project]
name = "sse-auto-translator"
version = "3.2.1"
description = "SSE Auto Translator"
license = { file = "LICENSE" }
authors = [{ name = "Cutleast", email = "cutleast@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "chunspell-next",
    "curl-cffi",
    "cutleast-core-lib",
    "deepl",
    "googletrans",
    "legacy-cgi",
    "libarchive-c",
    "lingua-language-detector",
    "lz4",
    "mod-manager-lib",
    "plyvel-next",
    "PySide6",
    "pytz",
    "pyuac",
    "pywin32",
    "pyzmq",
    "sse-bsa",
    "sse-plugin-interface",
    "websocket-client",
]

[dependency-groups]
dev = [
    "nuitka",
    "pyfakefs",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-qt",
    "python-dotenv",
    "requests-mock",
    "ruff",
    "types-requests",
]

[tool.uv.workspace]
members = [
    "core-lib",
    "mod-manager-lib",
]

[tool.uv.sources]
cutleast-core-lib = { workspace = true }
mod-manager-lib = { workspace = true }
lingua-language-detector = { url = "https://github.com/Modding-Forge/lingua-rs/releases/download/v2.2.0-2/lingua_language_detector-2.2.0.post2-cp314-cp314-win_amd64.whl" }

[tool.ruff]
line-length = 89

[tool.ruff.lint]
extend-select = ["D"]
ignore = [
    "D105",  # Missing docstring in magic method
    "D200",  # One-line docstring should fit on one line
    "D202",  # No blank line before function
    "D205",  # 1 blank line required between summary line and description
    "D212",  # Multi-line docstring summary should start at the second line
    "D415",  # First line should end with a period
    "RUF012",  # Mutable default values on class-level
    "UP040",  # type MyTypeAlias instead of MyTypeAlias: TypeAlias (still incompatible with Nuitka)
    "UP045",  # T | None instead of Optional[T]
    "UP046",  # New type-parameter syntax for generic classes (still incompatible with Nuitka, see https://github.com/Nuitka/Nuitka/issues/2930)
    "UP047",  # New type-parameter syntax for generic functions (still incompatible with Nuitka, see https://github.com/Nuitka/Nuitka/issues/2930)
]

[tool.ruff.lint.per-file-ignores]
"resources_rc.py" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "[%(asctime)s.%(msecs)03d][%(levelname)s][%(name)s.%(funcName)s]: %(message)s"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
exclude = ["**/__pycache__", "**/*.old", "src/resources_rc.py", "**/node_modules", "**/.*", ".venv"]
stubPath = "./stubs"
extraPaths = ["src", "core-lib/src", "mod-manager-lib/src"]

# Check here for a full list of options: https://github.com/microsoft/pyright/blob/main/docs/configuration.md#diagnostic-settings-defaults
deprecateTypingAliases = false
reportConstantRedefinition = true
reportDeprecated = "warning"
reportDuplicateImport = true
reportIncompleteStub = "warning"
reportIncompatibleMethodOverride = "warning"
reportInconsistentConstructor = "warning"
reportImplicitAbstractClass = "error"
reportImplicitOverride = "warning"
reportInvalidStubStatement = "warning"
reportMatchNotExhaustive = false
reportMissingImports = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportPrivateUsage = "warning"
reportTypeCommentUsage = "information"
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnnecessaryCast = "information"
reportUnnecessaryComparison = "information"
reportUnnecessaryContains = "information"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryTypeIgnoreComment = "information"
reportUnusedClass = "warning"
reportUnusedImport = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportWildcardImportFromLibrary = "warning"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
